<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School House Championship{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <a href="{{ url_for('public_bp.index') }}" class="text-lg font-black text-white">🏆 House Portal</a>
        <div class="flex items-center gap-3">
            <a href="{{ url_for('public_bp.export_csv') }}" class="px-3.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl font-semibold transition">
                Export Report
            </a>
            <a href="{{ url_for('admin_bp.login') }}" class="px-3.5 py-1.5 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold transition">
                Admin Portal
            </a>
        </div>
    </nav>
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
