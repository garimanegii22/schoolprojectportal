<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declare Result - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Admin Header -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold text-white">Admin Dashboard — Declare Result</h1>
        <a href="{{ url_for('admin_bp.dashboard') }}" class="px-3.5 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl transition font-medium">
            &larr; Back to Dashboard
        </a>
    </nav>

    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-12">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-white mb-2">Award Competition Points</h2>
            <p class="text-xs text-slate-400 mb-6">Select competition, house, and position to assign points and update the leaderboard.</p>

            <form method="POST" action="" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <!-- Competition Selection -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Select Competition</label>
                    <select name="competition_id" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="" disabled selected>Select event...</option>
                        {% for comp in competitions %}
                            <option value="{{ comp.id }}">{{ comp.name }} (Max: {{ comp.max_points }} pts)</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- House Selection -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Select Winning House</label>
                    <select name="house_id" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="" disabled selected>Select house...</option>
                        {% for house in houses %}
                            <option value="{{ house.id }}">{{ house.name }} House</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Position Selection -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Achieved Position</label>
                    <select name="position" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="1" selected>1st Place</option>
                        <option value="2">2nd Place</option>
                        <option value="3">3rd Place</option>
                        <option value="4">4th Place</option>
                    </select>
                </div>

                <!-- Points Awarded -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Points to Award</label>
                    <input type="number" name="points_awarded" min="1" required placeholder="e.g., 50"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                </div>

                <!-- Form Actions -->
                <div class="pt-4 flex gap-3">
                    <a href="{{ url_for('admin_bp.dashboard') }}" 
                       class="w-1/2 text-center bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-semibold transition">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="w-1/2 bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-semibold shadow-lg shadow-amber-600/30 transition">
                        Award Points
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
