<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - School House Championship</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-3xl">🔐</span>
            <h2 class="text-2xl font-black text-white mt-2">Admin Portal Login</h2>
            <p class="text-xs text-slate-400 mt-1">Enter your administrator credentials</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-xl text-xs font-semibold {% if category == 'danger' or category == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
                <input type="text" name="username" required placeholder="Enter username"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                <!-- Using admin_pass to avoid browser data breach warnings -->
                <input type="password" name="admin_pass" required placeholder="Enter password"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-600/30 transition">
                Sign In to Dashboard
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('public_bp.index') }}" class="text-xs text-slate-400 hover:text-slate-200 transition font-medium">
                &larr; Back to Public Portal
            </a>
        </div>
    </div>
</body>
</html>
