<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold text-white">Admin Dashboard — Student Registrations</h1>
        <a href="{{ url_for('admin_bp.dashboard') }}" class="px-3.5 py-1.5 text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl transition font-medium">
            &larr; Back to Dashboard
        </a>
    </nav>
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-10">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
            <h2 class="text-xl font-black text-white mb-4">Registered Participants</h2>
            <div class="divide-y divide-slate-800">
                {% for p in participants %}
                    <div class="py-3 flex justify-between items-center text-sm">
                        <span class="font-medium text-slate-200">{{ p.student_name }} (House ID: {{ p.house_id }})</span>
                        <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-lg">Event ID: {{ p.competition_id }}</span>
                    </div>
                {% else %}
                    <p class="text-slate-400 text-sm py-6 text-center">No student registrations recorded yet.</p>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
